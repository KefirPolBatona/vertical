{% extends 'catalog/base.html' %}

{% load static %}

{% block content %}


<form class="row" method="post" enctype="multipart/form-data">

    <div class="col-2">
        <div class="container-fluid">

            <ul class="navbar-nav mr-auto">
                <li class="nav-item active">
                    {% if object %}
                        <a class="nav-link" style="color: #ad916c" href="{% url 'catalog:product_detail' object.pk  %}">
                            << Назад
                        </a>
                    {% else %}
                        <a class="nav-link" style="color: #ad916c" href="{% url 'catalog:home' %}">
                            << Назад
                        </a>
                    {% endif %}
                </li>
            </ul>
        </div>
    </div>

    <div class="col-4 mb-5">
        <br>
        <br>
        <div class="container">
            <div class="card" style="background-color: #a6a190">

                <div class="card-header">
                    <h4 class="card-title">
                        Авторизация
                    </h4>
                </div>

                <div class="card-body">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-secondary">
                        Войти
                    </button>
                    <a class="p-2" href="{% url 'users:recovery_password' %}" >Восстановить пароль</a>
                </div>

            </div>
            <br>
        </div>
        <br>
        <br>
    </div>

</form>


</main>

<br>
<div class="jumbotron">
    <div class="container">
        <h1 class="display-2" style="color: #dbcd9e">
            <p class="text-center">В ы с о к и й с т и л ь</p>
        </h1>
    </div>
    <br>
</div>

<script src="{% static 'js/jquery-3.2.1.slim.min.js' %}"></script>

</body>

</html>
{% endblock %}
